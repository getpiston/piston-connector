name: Release

# chart/Chart.yaml is the one source of the chart's version: a release is the
# pull request that bumps `version`, and its merge to main publishes that version
# to oci://ghcr.io/getpiston/charts/piston-connector. A dispatch publishes what
# main's Chart.yaml names. A version is built once and never overwritten: one
# already published ends the run green, so a Chart.yaml edit that bumps nothing
# publishes nothing. CI already gated the commit, so this guards only the registry.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - chart/Chart.yaml
      - .github/workflows/release.yml

# Never cancelled: a publish stopped mid-push releases a chart nobody verified.
concurrency:
  group: piston-connector-chart
  cancel-in-progress: false

permissions:
  contents: read

env:
  HELM_VERSION: v4.3.1
  CHART_REPOSITORY: oci://ghcr.io/getpiston/charts

jobs:
  release:
    name: release the chart
    # A dispatch from another branch publishes nothing: only main's Chart.yaml is released.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read the version from Chart.yaml
        id: version
        run: |
          version="$(yq '.version' chart/Chart.yaml)"
          app_version="$(yq '.appVersion' chart/Chart.yaml)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Chart.yaml's version $version is not <major>.<minor>.<patch>"
            exit 1
          fi
          echo "chart $version, image $app_version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Ensure helm ${{ env.HELM_VERSION }}
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" \
            | tar -xzO linux-amd64/helm > "$HOME/.local/bin/helm"
          chmod +x "$HOME/.local/bin/helm"
          "$HOME/.local/bin/helm" version

      - name: Log helm in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin

      - name: Look for the version in the registry
        id: published
        # Authenticated: anonymously a private package's 401 would read as absent.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if helm show chart "$CHART_REPOSITORY/piston-connector" --version "$VERSION" >/dev/null 2>&1; then
            echo "::notice::chart $VERSION is published already; bump version in chart/Chart.yaml to release."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Copy the guide and the license into the chart
        if: steps.published.outputs.exists == 'false'
        run: cp README.md LICENSE chart/

      - name: Package and push the chart
        if: steps.published.outputs.exists == 'false'
        # No --version or --app-version: Chart.yaml names both.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          helm package chart -d "$RUNNER_TEMP/chart"
          helm push "$RUNNER_TEMP/chart/piston-connector-$VERSION.tgz" "$CHART_REPOSITORY"

