{{- if .Values.privateKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "piston-connector.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "piston-connector.labels" . | nindent 4 }}
type: Opaque
stringData:
  privateKey: {{ .Values.privateKey | quote }}
{{- end }}
