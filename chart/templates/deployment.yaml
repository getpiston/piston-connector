apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "piston-connector.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "piston-connector.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "piston-connector.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "piston-connector.labels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
        {{- if .Values.privateKey }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      # The connector never calls the Kubernetes API.
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- if gt (int .Values.replicas) 1 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "piston-connector.selectorLabels" . | nindent 14 }}
      {{- end }}
      containers:
        - name: connector
          image: "{{ .Values.image.repository }}:{{ include "piston-connector.tag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PISTON_CONNECTOR_ID
              value: {{ required "connectorId is the connector's id from the console's install line" .Values.connectorId | quote }}
            - name: PISTON_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "piston-connector.secretName" . }}
                  key: privateKey
            - name: PISTON_DNS_NAMESERVERS
              value: {{ join "," .Values.dns.nameservers | quote }}
            - name: PISTON_TUNNEL_RANGE
              value: {{ .Values.tunnelRange | quote }}
            - name: PISTON_LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
