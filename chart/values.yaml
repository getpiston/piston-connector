## What a job reaches is not set here: the routing rules on the connector's
## page in the Piston console grant it, and the README says what a pod CIDR
## or 0.0.0.0/0 in a rule exposes.

## Each replica is an instance of the connector, and the console lists them
## under Instances. A job's tunnel stays with one instance; when that instance
## stops, Piston moves the tunnel to one still running.
replicaCount: 2

image:
  repository: ghcr.io/getpiston/piston-connector
  pullPolicy: IfNotPresent
  ## Empty is the chart's appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  ## The connector never calls the Kubernetes API.
  automount: false
  annotations: {}
  ## Empty is the release's full name.
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

## No CPU limit: a limit throttles the tunnels' bursts; add replicas for more
## throughput.
resources:
  requests:
    cpu: 100m
    memory: 64Mi
  ## Each live UDP flow holds about 138 KiB, so 1 GiB carries some 7,000 at once;
  ## each large TCP transfer holds up to its connectorConfigs.tcp buffer maximum.
  limits:
    memory: 1Gi

livenessProbe:
  httpGet:
    path: /metrics
    port: metrics
readinessProbe:
  httpGet:
    path: /metrics
    port: metrics

volumes: []
volumeMounts: []

## An optional fence below the routing rules: a NetworkPolicy holding the
## connector's pods to these egress ranges whatever a rule grants. Each entry
## allows its cidr minus its except ranges. Piston and the tunnels' UDP are on
## the internet, so the ranges must still hold it; DNS to the cluster's kube-dns
## is always allowed. Only a network plugin that enforces NetworkPolicy applies
## it, and some never match in-cluster pods to a range: see the README.
networkPolicy:
  enabled: false
  egress:
    - cidr: 0.0.0.0/0
      except: []

nodeSelector: {}
tolerations: []
affinity: {}

## The connector's own settings; the README's Settings table names the
## environment variable each one becomes.
connectorConfigs:
  ## Required: the connector's id, as the console's install line carries it,
  ## what the connector names itself to Piston as, beside its key.
  connectorId: ""

  ## The connector's private key, Curve25519, 32 bytes of base64: the one the
  ## Piston console generated and showed once, or one `wg genkey` made. Set
  ## this or existingSecret, never both.
  privateKey: ""
  ## The name of a Secret of your own, in the release's namespace, holding the
  ## private key under the key `privateKey`. Set this or privateKey, never both.
  existingSecret: ""

  ## What the connector writes to standard output, one JSON object a line:
  ## debug, info, warn or error. At info the lines are the audit and access log
  ## the README lists; debug adds every DNS answer and control frame.
  logLevel: info

  ## The Piston control plane the connector talks to. Empty is Piston's
  ## production, which the image defaults to; set it only when Piston says so.
  apiUrl: ""

  ## How the connector carries each connection of a job. A connection runs
  ## only as fast as the data it may keep in flight over the round trip
  ## between the job and the connector, so these matter for a connector far
  ## from Piston's runners and not for one near them. The README's Performance
  ## tuning section says when to change each.
  tcp:
    ## The most each connection may buffer toward the job, in MiB, 1 to 256:
    ## what a download keeps in flight. Every large download grows its buffer
    ## to this, near or far, so it is memory each one can hold.
    sendBufferMaxMiB: 16
    ## The same for what the job sends through the connector: an upload keeps
    ## up to half of it in flight.
    receiveBufferMaxMiB: 16
    ## How a connection slows down after a lost packet and speeds up again:
    ## reno, or cubic, which recovers sooner over a long round trip.
    congestionControl: reno
    ## How many packets may wait to enter the tunnels during a burst, 256 to
    ## 65536, one queue for all of an instance's tunnels. Beyond it packets are
    ## dropped and sent again, which slows a fast transfer.
    tunnelQueuePackets: 4096
